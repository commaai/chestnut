[project]
name = "chestnut"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tinygrad",
  "jinja2==3.1.6",
  "numpy==2.3.5",
  "opencv-python>=4.11,<5",
  "ultralytics==8.4.153",
  "av>=15,<17",
  "teleoprtc @ https://github.com/commaai/teleoprtc/archive/1aa8fc433bef1519a95c0700c96258c3be6dfb34.tar.gz",
  "onnx>=1.17,<2",
  "torch>=2.5",
  "torchvision>=0.20",
]

[tool.uv]
package = false

[tool.uv.sources]
# PyPI 0.13 lacks Chestnut's USB ID; 0.14 omits chat kernels.
tinygrad = {url = "https://github.com/tinygrad/tinygrad/archive/cc32aa18db3a8ff277f2649a5f93540df1e4c0ee.tar.gz"}
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
